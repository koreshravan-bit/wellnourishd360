name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build prerendered pages
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://wellnourishd360.com
        run: bun run build
      - name: Collect static site
        run: |
          if [ -f .output/public/index.html ]; then OUT=.output/public; else OUT=dist/client; fi
          test -f "$OUT/index.html"
          rm -rf site && cp -r "$OUT" site
          if [ ! -f site/404.html ] && [ -f site/404/index.html ]; then cp site/404/index.html site/404.html; fi
          test -f site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
